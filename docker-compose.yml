# Local stack. Values come from the git-ignored .env file (template: .env.example).
#   docker compose up --build   -> PostgreSQL + the application image (profile prod), one command
#   docker compose up -d db     -> only PostgreSQL, for ./mvnw spring-boot:run with profile dev
name: sitelog

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Same multi-stage Dockerfile and same prod profile as Render; only the database differs.
    build: .
    image: sitelog-app:local
    restart: unless-stopped
    depends_on:
      db:
        # Wait for pg_isready, not just for the container to exist, so Flyway can connect.
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Container-to-container address "db". The local PostgreSQL has no TLS certificate, so the
      # URL disables TLS (Supabase in production uses sslmode=require).
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?sslmode=disable
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
