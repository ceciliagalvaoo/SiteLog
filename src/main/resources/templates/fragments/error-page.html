<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/*
  Body of the error pages error/403, 404, 409 and 500 (no frame in the prototype: built from the
  empty-state and button components, inside the normal layout).
  Never shows a stack trace or an exception message (server.error.include-stacktrace=never,
  include-message=never): only texts from messages.properties.

  errorBody(code, title, body, reloadUrl)
    code      - HTTP status shown in the eyebrow
    title     - resolved text
    body      - resolved text
    reloadUrl - app-relative URL for "Reload the page" (409) or null
*/-->
<div th:fragment="errorBody(code, title, body, reloadUrl)" class="card error-page">
	<div class="empty-state">
		<span class="empty-state__icon" aria-hidden="true">
			<svg th:replace="~{fragments/icon :: icon(${code == 403 ? 'lock' : 'alert'})}"></svg>
		</span>
		<p class="eyebrow" th:text="#{error.page.eyebrow(${code})}">Error 404</p>
		<h1 th:text="${title}">Page not found</h1>
		<p class="text-muted" th:text="${body}">The page or record you are looking for does not exist.</p>
		<div class="form-actions form-actions--center">
			<a class="btn btn--primary" th:if="${reloadUrl != null}" th:href="@{${reloadUrl}}" th:text="#{error.reload}">Reload the page</a>
			<a class="btn" th:classappend="${reloadUrl != null} ? 'btn--secondary' : 'btn--primary'"
			   th:href="@{/sites}" href="/sites" th:text="#{error.goToSites}">Go to sites</a>
		</div>
	</div>
</div>
</body>
</html>
